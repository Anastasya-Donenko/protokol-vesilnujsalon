<style>
:root{--bg:#04090e;--card:#0a161e;--card2:#0e1f2a;--line:rgba(47,227,208,.25);--text:#e6f2f7;--muted:#86a0b3;--cyan:#2fe3d0;--lime:#c9e86b;--amber:#efc35f;--red:#ff5c6c;--glow:0 0 30px rgba(47,227,208,.14);--tw:"Courier New",Courier,"PT Mono",monospace}

  linear-gradient(180deg,var(--card2),var(--card));
 border:1px solid var(--line);border-radius:4px 18px 18px 18px;box-shadow:var(--glow),inset 0 0 60px rgba(0,0,0,.35);padding:34px 32px 28px;margin:34px 0 20px;position:relative}

.case h3{font:700 25px/1.2 var(--tw);text-transform:uppercase;letter-spacing:.03em}
.score{font:26.5px/1 var(--tw);white-space:nowrap;color:var(--amber);border:2px solid currentColor;padding:6px 10px;border-radius:4px;transform:rotate(-3deg)}
.tool{color:var(--muted);font:15.5px/1.4 var(--tw);margin:6px 0 10px}
ul.finds{margin:8px 0 12px;padding-left:20px}
ul.finds li{margin:8px 0;line-height:1.5}
ul.finds li::marker{content:"▸ ";color:var(--cyan)}
ul.alibi li::marker{content:"✓ ";color:var(--lime)}
.what{font-weight:600}
.ev,.why{display:block;font-size:16px;line-height:1.45;margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
.ev{color:#c3d3de}
.why{color:var(--muted);border-left-color:rgba(239,195,95,.45)}
.lab{display:block;font:700 12.5px/1.2 var(--tw);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:2px}
.why .lab{color:var(--amber)}
ul.alibi .why .lab{color:var(--lime)}
ul.alibi .why{border-left-color:rgba(201,232,107,.45)}
.fix{background:rgba(201,232,107,.07);border:1px dashed rgba(201,232,107,.5);padding:12px 14px;border-radius:6px;line-height:1.5}
.fix b{color:var(--lime);font:18px var(--tw);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0;font-size:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px dashed var(--line)}
tr:last-child td{border-bottom:0}
th{background:rgba(47,227,208,.08);color:var(--cyan);font:15.5px var(--tw);letter-spacing:.06em;text-transform:uppercase}
.shots{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.shots figure,.ba figure{margin:0;padding:8px 8px 10px;background:#e8e2d4;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.shots figure:nth-child(1){transform:rotate(-1deg)}.shots figure:nth-child(2){transform:rotate(1.5deg)}
.shots img,.ba img{width:100%;display:block;background:#000}
.shots figcaption,.ba figcaption{font:15.5px/1.2 var(--tw);color:#2a2620;margin-top:8px;text-align:center}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ba .tag{display:inline-block;font:17px/1 var(--tw);letter-spacing:.14em;padding:6px 12px;border:2px solid currentColor;border-radius:4px;margin-bottom:10px;transform:rotate(-3deg)}
.ba .before .tag{color:var(--red)}
.ba .after .tag{color:var(--cyan)}
.top{counter-reset:t}
.top .item{border:1px solid var(--line);background:rgba(47,227,208,.035);border-radius:6px;padding:18px 18px 16px 66px;margin-bottom:14px;position:relative}
.top .item::before{counter-increment:t;content:counter(t);position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:24px/1 var(--tw);color:#03121a;background:linear-gradient(135deg,var(--cyan),var(--lime));box-shadow:0 0 14px rgba(47,227,208,.45)}
.top .item h3{font:700 24px/1.2 var(--tw);text-transform:uppercase;letter-spacing:.02em}
.ice{font:15px/1.3 var(--tw);color:var(--cyan);letter-spacing:.04em;margin-bottom:6px}
.ready{margin-top:10px;padding:12px 14px;background:rgba(0,0,0,.3);border:1px dashed var(--line);border-radius:6px;white-space:pre-wrap;font:17px/1.55 var(--tw)}
.foot{color:var(--muted);font:14.5px/1.4 var(--tw);text-align:center;margin-top:14px;letter-spacing:.06em}
a{color:var(--cyan)}
p{line-height:1.55}
.el{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.el .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;background:rgba(47,227,208,.03)}.el .st{font:700 14.5px/1 var(--tw);letter-spacing:.08em;padding:5px 8px;border-radius:3px;border:1.5px solid currentColor;white-space:nowrap;margin-top:2px}.el .nm{font:700 18px/1.25 var(--tw);text-transform:uppercase}.el .nt{color:var(--muted);font-size:15.5px;margin-top:3px;line-height:1.45}
.meta b,.meta span{overflow-wrap:anywhere}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0}.tw table{margin:0}
@media (max-width:720px){.el{grid-template-columns:1fr}.case-head{flex-wrap:wrap}.score{white-space:normal;font-size:20px}table{font-size:14.5px}th,td{padding:7px 8px}}

@media (max-width:720px){.index,.victim,.shots,.ba{grid-template-columns:1fr}.stamp{position:static;display:inline-block;margin-bottom:12px}.paper{padding:26px 18px}}
@media print{.wrap{padding:0}.paper{box-shadow:none;margin:30px 0 12px}.paper.keep{break-inside:avoid-page}.case,.top .item,figure,tr{break-inside:avoid}h2{break-after:avoid}audio{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = JSON.parse(document.getElementById('case-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = v => v <= 25 ? 'var(--cyan)' : v <= 50 ? 'var(--amber)' : 'var(--red)';
const v = Math.max(0, Math.min(100, +D.index.value || 0));
const tbl = t => !t || !t.head ? '' : `<div class="tw"><table><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(t.rows||[]).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fig = (src, cap) => src ? `<figure><img src="${esc(src)}" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>` : '';
const sh = D.shots || {};
const SRC = {'сайт':'на сайті','скриншот':'на скриншоті','пошук':'за пошуком','вимір':'вимірювання'};
const proof = f => {
  const src = f.source ? (SRC[f.source] || f.source) : '';
  let h = '';
  if (f.evidence) h += `<span class="ev"><b class="lab">Де побачили${src ? ' · ' + esc(src) : ''}</b>${esc(f.evidence)}</span>`;
  if (f.why) h += `<span class="why"><b class="lab">Чому це важливо</b>${esc(f.why)}</span>`;
  return h;
};
const years = n => { n = Math.abs(+n||0); const a = n % 100, b = n % 10; return (a > 10 && a < 20) ? 'років' : b === 1 ? 'рік' : (b >= 2 && b <= 4) ? 'роки' : 'років'; };
document.getElementById('app').innerHTML = `
<section class="paper keep" data-tab="Справа № ${esc(D.site.caseNo)}">
  <div class="stamp" style="color:${color(v)}">${esc(D.index.level)}</div>
  <div class="type">Протокол розслідування · AI-Детектив</div>
  <h1><span class="grad">${esc(D.site.name)}</span></h1>
  <div class="meta"><span>Місце злочину: <b>${esc(D.site.url)}</b></span><span>Ніша: <b>${esc(D.site.niche)}</b></span><span>Дата: <b>${esc(D.site.date)}</b></span></div>
  <div class="secret">ЦІЛКОМ ТАЄМНО · ЛИШЕ ДЛЯ ВЛАСНИКА САЙТУ</div>
</section>
<section class="paper keep" data-tab="Висновок експерта">
  <h2>Індекс <span class="grad">підозрілості</span></h2>
  <div class="index">
    <div class="gauge" style="background:conic-gradient(${color(v)} ${v*3.6}deg, rgba(255,255,255,.06) 0)"><div class="in"><div><b style="color:${color(v)}">${v}</b><small>зі 100</small></div></div></div>
    <div><div class="level" style="color:${color(v)}">${esc(D.index.level)}</div><p style="margin:0 0 10px">${esc(D.index.verdict)}</p><div class="bar"><i style="width:${v}%;background:${color(v)}"></i></div>${D.index.notCounted ? `<div class="note">Не враховано: ${esc(D.index.notCounted)}</div>` : ''}</div>
  </div>
</section>
<section class="paper keep" data-tab="Алібі">
  <h2>Алібі: <span class="grad">що вже працює</span></h2>
  <ul class="finds alibi">${(D.alibi||[]).map(a => `<li><span class="what">${esc(a.text)}</span>${proof(Object.assign({}, a, {why: a.why}))}</li>`).join('')}</ul>
  <div class="note">Це не чіпаємо під час правок — воно вже працює на вас.</div>
</section>
<section class="paper keep" data-tab="Допит свідка">
  <h2>Свідчення клієнта, <span class="grad">який пішов</span></h2>
  <div class="victim">
    <div class="mug"><div class="face">👤</div><div class="name">${esc(D.victim.name)}</div><div class="age">${esc(D.victim.age)} ${years(D.victim.age)}</div><p style="font-size:15.5px;text-align:left">${esc(D.victim.situation)}</p></div>
    <div>${D.victim.audio ? `<audio controls src="${esc(D.victim.audio)}" style="margin:0 0 14px"></audio>` : ''}<blockquote>${esc(D.victim.confession)}</blockquote><p style="margin:14px 0 0;color:var(--muted)"><b>Фоторобот.</b> ${esc(D.victim.portrait)}</p><div class="recon">Реконструкція: портрет і зізнання змодельовані AI на основі знахідок розслідування.</div></div>
  </div>
</section>
<section class="paper" data-tab="Фото з місця злочину">
  <h2>Огляд <span class="grad">місця злочину</span></h2>
  <div class="shots">${fig(sh.desktop,'Перший екран · компʼютер')}${fig(sh.mobile,'Перший екран · телефон')}</div>
</section>
<section class="paper" data-tab="Матеріали справи">
  <h2>Сім <span class="grad">справ</span></h2>
  ${D.cases.map(c => `<div class="case"><div class="case-head"><div><div class="case-no">СПРАВА № ${esc(c.no)}</div><h3>${esc(c.title)}</h3></div><div class="score">${esc(c.score)} / ${esc(c.maxCounted || c.max)}${c.maxCounted && c.maxCounted != c.max ? ' · без швидкості' : ''}</div></div>
  <div class="bar" style="height:8px;margin:6px 0"><i style="width:${Math.round(100*(+c.score||0)/(+(c.maxCounted||c.max)||1))}%;background:linear-gradient(90deg,var(--amber),var(--red))"></i></div>
  <div class="tool">Інструмент: ${esc(c.tool)}</div>
  <ul class="finds">${(c.findings||[]).map(f => `<li><span class="what">${esc(f.text)}</span>${proof(f)}</li>`).join('')}</ul>
  ${tbl(c.table)}
  ${c.fix ? `<div class="fix"><b>Головна правка:</b> ${esc(c.fix)}</div>` : ''}</div>`).join('')}
</section>
<section class="paper" data-tab="Чек-лист Вікторії">
  <h2>10 елементів <span class="grad">сайту, який продає</span></h2>
  <div class="el">${(D.elements||[]).map(e => { const c = e.status === 'є' ? 'var(--cyan)' : e.status === 'частково' ? 'var(--amber)' : 'var(--red)'; return `<div class="row"><span class="st" style="color:${c}">${esc(String(e.status||'').toUpperCase())}</span><div><div class="nm">${esc(e.name)}</div><div class="nt">${esc(e.note)}</div></div></div>`; }).join('')}</div>
  <div class="note">За системою Вікторії Соколик · курс AI-Сайти в AI Money Club</div>
</section>
<section class="paper" data-tab="Вирок">
  <h2>Що докрутити: <span class="grad">топ-3 на сьогодні</span></h2>
  <div class="top">${D.top3.map(t => `<div class="item"><h3>${esc(t.title)}</h3><div class="ice">Ефект ${esc(t.ice.i)} · Впевненість ${esc(t.ice.c)} · Легкість ${esc(t.ice.e)} = ${t.ice.i*t.ice.c*t.ice.e}</div><p>${esc(t.why)}</p><p><b>Що зробити:</b> ${esc(t.how)}</p>${t.ready ? `<div class="ready">${esc(t.ready)}</div>` : ''}</div>`).join('')}</div>
</section>
<div class="foot">AI-Детектив · протокол створено автоматично · висновки — на основі того, що видно на сайті</div>`;
document.title = 'Протокол № ' + D.site.caseNo + ' · ' + D.site.name;
</script>
</body>
</html>
